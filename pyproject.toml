[project]
name = "repl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.2.18",
    "langchain-core==1.4.0",
    "langchain-ollama==1.1.0",
    "ollama==0.6.2",
    "python-dotenv>=1.2.2",
]
[project.scripts]
repl  = "repl:main"

[build-system]                       
# build dependency: the hatchling backend
requires = ["hatchling"]             
build-backend = "hatchling.build"    

[tool.hatch.build.targets.wheel]  
# which files to include in the wheel distribution.
include = ["repl.py"]
